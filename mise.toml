[tools]
node = "24"
"npm:@gram-lang/cli" = { version = "1", allow_low_downloads = true }
"aqua:evilmartians/lefthook" = "2"

[hooks]
postinstall = "lefthook install"

[tasks.build]
alias = "default"
description = "Generate the recipes in Markdown format"
run = "ls *.gram | xargs -L1 gram export --format md"

[tasks.clean]
description = "Remove generated recipe Markdown files"
run = 'for file in *.gram; do rm -f "${file%.gram}.md"; done'